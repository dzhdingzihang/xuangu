<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f8fc" />
    <title>智能选股</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
    <link rel="stylesheet" href="/static/styles.css?v=20260827-lazy-stale-gate" />
  </head>
  <body>
    <a class="skip-link" href="#mainContent">跳到主内容</a>
    <div class="app-shell">
      <aside class="side-rail" aria-label="主导航">
        <a class="brand" href="#decision" aria-label="智能选股首页">
          <span class="brand-name">智能选股</span>
          <small class="brand-subtitle">10-DAY DECISION</small>
        </a>

        <nav class="primary-nav" role="tablist" aria-label="智能选股功能">
          <button id="tab-decision" class="nav-item is-active" type="button" role="tab" aria-label="今日答案" aria-selected="true" aria-controls="panel-decision" data-tab="decision">
            <i class="ph ph-target" aria-hidden="true"></i><span>今日答案</span>
          </button>
          <button id="tab-candidates" class="nav-item" type="button" role="tab" aria-label="候选池" aria-selected="false" aria-controls="panel-candidates" data-tab="candidates">
            <i class="ph ph-star" aria-hidden="true"></i><span>候选池</span>
          </button>
          <button id="tab-events" class="nav-item" type="button" role="tab" aria-label="事件证据" aria-selected="false" aria-controls="panel-events" data-tab="events">
            <i class="ph ph-bell" aria-hidden="true"></i><span>事件证据</span>
          </button>
          <button id="tab-history" class="nav-item" type="button" role="tab" aria-label="历史检验" aria-selected="false" aria-controls="panel-history" data-tab="history">
            <i class="ph ph-clock-counter-clockwise" aria-hidden="true"></i><span>历史检验</span>
          </button>
          <button id="tab-model" class="nav-item" type="button" role="tab" aria-label="模型逻辑" aria-selected="false" aria-controls="panel-model" data-tab="model">
            <i class="ph ph-book-open" aria-hidden="true"></i><span>模型逻辑</span>
          </button>
          <button id="tab-health" class="nav-item" type="button" role="tab" aria-label="数据健康" aria-selected="false" aria-controls="panel-health" data-tab="health">
            <i class="ph ph-database" aria-hidden="true"></i><span>数据健康</span>
          </button>
        </nav>

        <section class="market-rail" aria-labelledby="marketRailTitle">
          <h2 id="marketRailTitle">市场制度</h2>
          <div id="railMarketStatus" class="rail-market-list">
            <div class="rail-market-row is-loading"><span class="market-dot market-a">A</span><span><b>A股</b><small>读取中</small></span></div>
            <div class="rail-market-row is-loading"><span class="market-dot market-hk">港</span><span><b>港股</b><small>读取中</small></span></div>
            <div class="rail-market-row is-loading"><span class="market-dot market-us">美</span><span><b>美股</b><small>读取中</small></span></div>
          </div>
        </section>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="page-heading">
            <h1 id="pageTitle">决策</h1>
            <p id="pageSubtitle">今日跨市场执行建议</p>
          </div>
          <div class="freshness-bar" aria-label="数据状态">
            <span><i class="ph ph-clock" aria-hidden="true"></i><b>当前时间</b><time id="currentTime">--</time></span>
            <span><b>快照生成</b><time id="snapshotAsOf">--</time></span>
            <span><b>下次计划检查点（含健康补跑）</b><time id="nextRefreshTime">--</time></span>
            <span id="healthBadge" class="health-badge is-loading"><i class="ph-fill ph-circle" aria-hidden="true"></i>读取中</span>
            <span id="qualityBadge" class="health-badge is-degraded" hidden><i class="ph ph-warning-octagon" aria-hidden="true"></i>数据受限</span>
            <button id="refreshBtn" class="icon-button" type="button" aria-label="刷新已发布快照" title="刷新已发布快照">
              <i class="ph ph-arrows-clockwise" aria-hidden="true"></i><span>刷新快照</span>
            </button>
          </div>
        </header>

        <div id="snapshotExecutionBanner" class="snapshot-execution-banner snapshot-execution-banner-global" role="alert" hidden>
          <i class="ph ph-warning-octagon" aria-hidden="true"></i>
          <div><strong>快照非 fresh，暂停执行</strong><span>页面只展示历史研究结果，等待新快照发布。</span></div>
        </div>

        <main id="mainContent" class="main-content" tabindex="-1">
          <section id="panel-decision" class="tab-panel is-active" role="tabpanel" aria-labelledby="tab-decision" data-tab="decision">
            <div id="decisionView" class="view-loading" aria-live="polite">
              <i class="ph ph-spinner-gap" aria-hidden="true"></i><span>正在读取三市场决策快照…</span>
            </div>
          </section>

          <section id="panel-candidates" class="tab-panel" role="tabpanel" aria-labelledby="tab-candidates" data-tab="candidates" hidden>
            <div id="candidatesView" class="view-loading" aria-live="polite">
              <i class="ph ph-spinner-gap" aria-hidden="true"></i><span>正在整理候选池…</span>
            </div>
          </section>

          <section id="panel-events" class="tab-panel" role="tabpanel" aria-labelledby="tab-events" data-tab="events" hidden>
            <div id="eventsView" class="view-loading" aria-live="polite">
              <i class="ph ph-spinner-gap" aria-hidden="true"></i><span>正在整理事件证据…</span>
            </div>
          </section>

          <section id="panel-history" class="tab-panel" role="tabpanel" aria-labelledby="tab-history" data-tab="history" hidden>
            <div id="historyView" class="view-loading" aria-live="polite">
              <i class="ph ph-spinner-gap" aria-hidden="true"></i><span>正在读取不可变快照…</span>
            </div>
          </section>

          <section id="panel-model" class="tab-panel" role="tabpanel" aria-labelledby="tab-model" data-tab="model" hidden>
            <div id="modelView" class="view-loading" aria-live="polite">
              <i class="ph ph-spinner-gap" aria-hidden="true"></i><span>正在读取模型版本与规则…</span>
            </div>
          </section>

          <section id="panel-health" class="tab-panel" role="tabpanel" aria-labelledby="tab-health" data-tab="health" hidden>
            <div id="healthView" class="view-loading" aria-live="polite">
              <i class="ph ph-spinner-gap" aria-hidden="true"></i><span>正在核对市场、证据与调度状态…</span>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="toastRegion" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="/static/app.js?v=20260827-lazy-stale-gate"></script>
  </body>
</html>
