name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt PyYAML==6.0.3
          npm ci

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check static/app.js
          node --check scripts/score_dual_low.mjs
          node --check vendor/stock-scoring-kit/index.js

      - name: Parse workflow YAML
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              payload = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(payload, dict):
                  raise SystemExit(f"workflow is not a mapping: {path}")
              print(path)
          PY

      - name: Build bounded assets
        run: |
          npm run build
          python scripts/publish_data_assets.py --source-root public/data --dry-run

      - name: Wrangler dry-run
        run: npx --no-install wrangler deploy --dry-run
