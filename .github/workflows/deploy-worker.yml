name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions is the device-free primary scheduler.  These invocations
    # do not depend on a Cloudflare workflow-dispatch token.
    - cron: "17 0 * * 1-5"
    - cron: "17 2 * * 1-5"
    - cron: "17 4 * * 1-5"
    - cron: "17 7 * * 1-5"
    - cron: "17 8 * * 1-5"
    - cron: "17 12 * * 1-5"
    - cron: "47 14 * * 1-5"
    # US post-close primary invocations; schedule_gate admits only the UTC
    # expression that currently maps to 16:17 America/New_York.
    - cron: "17 20 * * 1-5"
    - cron: "17 21 * * 1-5"
    # Thirty-minute GitHub watchdogs repair a primary checkpoint only when the
    # complete production snapshot does not already cover it.
    - cron: "47 0 * * 1-5"
    - cron: "47 2 * * 1-5"
    - cron: "47 4 * * 1-5"
    - cron: "47 7 * * 1-5"
    - cron: "47 8 * * 1-5"
    - cron: "47 12 * * 1-5"
    # Beijing 23:17 fallback for the 22:47 US-open checkpoint.
    - cron: "17 15 * * 1-5"
    # 30-minute US post-close watchdogs. schedule_gate skips the expression
    # that is inactive for the current America/New_York DST offset.
    - cron: "47 20 * * 1-5"
    - cron: "47 21 * * 1-5"
  workflow_dispatch:
    inputs:
      scheduler:
        description: Scheduled dispatcher identity; leave blank for a manual run
        required: false
        type: string
      cron:
        description: UTC cron expression supplied by the scheduled dispatcher
        required: false
        type: string
      scheduled_at:
        description: Timezone-aware scheduler invocation timestamp
        required: false
        type: string

permissions: {}

concurrency:
  group: xuangu-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      should_archive: ${{ steps.snapshot_bundle.outputs.should_archive }}
      should_publish: ${{ steps.publish_guard.outputs.should_publish }}
      snapshot_key: ${{ steps.snapshot_bundle.outputs.snapshot_key }}
      snapshot_sha256: ${{ steps.snapshot_bundle.outputs.snapshot_sha256 }}
      has_checkpoint_receipt: ${{ steps.checkpoint_receipt.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve workflow trigger mode
        id: trigger_context
        env:
          SCHEDULED_LIKE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scheduler == 'cloudflare-cron-v1') }}
        run: echo "scheduled_like=${SCHEDULED_LIKE}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Check scheduled time slot and source health
        id: schedule_gate
        if: steps.trigger_context.outputs.scheduled_like == 'true'
        run: python scripts/schedule_gate.py
        env:
          # Only deployed production state may suppress a recovery run. A
          # checked-out latest.json is not proof that deployment succeeded.
          SCHEDULE_GATE_STATUS_URL: https://xuangu.alixjd.com/api/latest
          SCHEDULE_GATE_CRON: ${{ github.event.schedule || inputs.cron }}
          SCHEDULE_GATE_SCHEDULED_AT: ${{ inputs.scheduled_at }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.trigger_context.outputs.scheduled_like != 'true' || steps.schedule_gate.outputs.should_run == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        if: steps.trigger_context.outputs.scheduled_like != 'true' || steps.schedule_gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run Python unit tests
        if: steps.trigger_context.outputs.scheduled_like != 'true' || steps.schedule_gate.outputs.should_run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Check Worker and browser JavaScript
        if: steps.trigger_context.outputs.scheduled_like != 'true' || steps.schedule_gate.outputs.should_run == 'true'
        run: |
          node --check src/index.js
          node --check static/app.js
          node --check scripts/score_dual_low.mjs
          node --check vendor/stock-scoring-kit/index.js

      - name: Adopt newer production snapshot before a push deploy
        if: github.event_name == 'push'
        run: >-
          python scripts/verify_deployment.py data/picks/latest.json
          --base-url https://xuangu.alixjd.com
          --adopt-newer-live

      - name: Restore A-share daily K-line cache
        if: (github.event_name == 'workflow_dispatch' && steps.trigger_context.outputs.scheduled_like != 'true') || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/runtime-cache/a_share_daily.json
          key: a-share-d1-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            a-share-d1-v2-

      - name: Restore HK/US dynamic recall cache
        if: (github.event_name == 'workflow_dispatch' && steps.trigger_context.outputs.scheduled_like != 'true') || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/runtime-cache/hk_us_dynamic_recall.json
          key: hk-us-dynamic-recall-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hk-us-dynamic-recall-v1-

      - name: Restore HK/US daily K-line cache
        if: (github.event_name == 'workflow_dispatch' && steps.trigger_context.outputs.scheduled_like != 'true') || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/runtime-cache/hk_us_daily.json
          key: hk-us-d1-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hk-us-d1-v2-

      - name: Generate smart pick snapshot
        if: (github.event_name == 'workflow_dispatch' && steps.trigger_context.outputs.scheduled_like != 'true') || steps.schedule_gate.outputs.should_run == 'true'
        env:
          AUTOMATION_TRIGGER: ${{ steps.trigger_context.outputs.scheduled_like == 'true' && 'schedule' || github.event_name }}
          SCHEDULED_SLOT: ${{ steps.schedule_gate.outputs.slot }}
          SCHEDULED_INVOCATION_SLOT: ${{ steps.schedule_gate.outputs.invocation_slot }}
          SCHEDULED_SOURCE_INVOCATION_SLOT: ${{ steps.schedule_gate.outputs.source_invocation_slot }}
          SCHEDULER_DELAY_SECONDS: ${{ steps.schedule_gate.outputs.scheduler_delay_seconds }}
          SCHEDULER_START_DELAY_SECONDS: ${{ steps.schedule_gate.outputs.scheduler_start_delay_seconds }}
          SCHEDULE_GATE_EVALUATED_AT: ${{ steps.schedule_gate.outputs.gate_evaluated_at }}
          EFFECTIVE_CHECKPOINT: ${{ steps.schedule_gate.outputs.effective_checkpoint }}
          SCHEDULE_RECOVERY_MODE: ${{ steps.schedule_gate.outputs.recovery_mode }}
          EVENT_SCAN_CANDIDATES_PER_MARKET: "16"
        run: |
          for attempt in 1 2 3; do
            echo "Snapshot generation attempt ${attempt}/3"
            if GENERATION_ATTEMPT="${attempt}" python server.py --once --force --quiet; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Snapshot generation failed after 3 attempts" >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 15))
            echo "Retrying in ${sleep_seconds}s"
            sleep "${sleep_seconds}"
          done

      - name: Update isolated outcome ledgers
        if: (github.event_name == 'workflow_dispatch' && steps.trigger_context.outputs.scheduled_like != 'true') || steps.schedule_gate.outputs.should_run == 'true'
        run: |
          # Run after generation so eligible formal and research predictions are
          # registered as PENDING while mature outcomes settle idempotently.
          for attempt in 1 2 3; do
            echo "Outcome settlement attempt ${attempt}/3"
            if python scripts/settle_outcomes.py; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Outcome settlement failed after 3 attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          python scripts/settle_rule_outcomes.py --max-workers 12 --retries 0

      - name: Validate published snapshot schema
        if: steps.trigger_context.outputs.scheduled_like != 'true' || steps.schedule_gate.outputs.should_run == 'true'
        run: python scripts/validate_snapshot.py data/picks/latest.json

      - name: Enforce monotonic logical schedule order before deploy
        id: publish_guard
        if: steps.trigger_context.outputs.scheduled_like == 'true' && steps.schedule_gate.outputs.should_run == 'true'
        run: >-
          python scripts/deployment_order_guard.py data/picks/latest.json
          --base-url https://xuangu.alixjd.com

      - name: Save validated A-share daily K-line cache
        if: (github.event_name == 'workflow_dispatch' && steps.trigger_context.outputs.scheduled_like != 'true') || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/runtime-cache/a_share_daily.json
          key: a-share-d1-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save validated HK/US dynamic recall cache
        if: (github.event_name == 'workflow_dispatch' && steps.trigger_context.outputs.scheduled_like != 'true') || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/runtime-cache/hk_us_dynamic_recall.json
          key: hk-us-dynamic-recall-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save validated HK/US daily K-line cache
        if: (github.event_name == 'workflow_dispatch' && steps.trigger_context.outputs.scheduled_like != 'true') || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/runtime-cache/hk_us_daily.json
          key: hk-us-d1-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare immutable snapshot recovery bundle
        id: snapshot_bundle
        if: (github.event_name == 'workflow_dispatch' && steps.trigger_context.outputs.scheduled_like != 'true') || steps.schedule_gate.outputs.should_run == 'true'
        env:
          RECOVERY_DIR: ${{ runner.temp }}/snapshot-recovery-${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          from scripts.snapshot_archive_policy import ARCHIVE_POLICY, archive_reasons
          from scripts.verify_deployment import snapshot_sha256

          latest_path = pathlib.Path("data/picks/latest.json")
          snapshot = json.loads(latest_path.read_text(encoding="utf-8"))
          snapshot_key = str(snapshot.get("snapshot_key") or "")
          if pathlib.PurePosixPath(snapshot_key).name != snapshot_key or not snapshot_key.endswith(".json"):
              raise SystemExit(f"unsafe snapshot_key: {snapshot_key!r}")
          immutable_path = latest_path.parent / snapshot_key
          if not immutable_path.is_file():
              raise SystemExit(f"immutable snapshot is missing: {immutable_path}")
          if immutable_path.read_bytes() != latest_path.read_bytes():
              raise SystemExit("latest.json and immutable timestamp snapshot differ")

          recovery = pathlib.Path(os.environ["RECOVERY_DIR"])
          recovery.mkdir(parents=True, exist_ok=True)
          target_picks = recovery / "data" / "picks"
          target_picks.mkdir(parents=True, exist_ok=True)
          shutil.copy2(latest_path, target_picks / "latest.json")
          shutil.copy2(immutable_path, target_picks / snapshot_key)

          # Outcome tracks use separate directories. Recursion keeps the legacy
          # flat Shadow files and the formal executable ledger in the bundle.
          ledger_candidates = list(pathlib.Path("data/outcomes").rglob("*.json"))
          for pattern in ("*ledger*.json", "*ledger*.jsonl"):
              ledger_candidates.extend(pathlib.Path("data").rglob(pattern))
          ledger_files = []
          for ledger in sorted(set(ledger_candidates)):
              if not ledger.is_file():
                  continue
              target = recovery / ledger
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(ledger, target)
              ledger_files.append(ledger.as_posix())

          digest = snapshot_sha256(snapshot)
          reasons = archive_reasons(snapshot)
          should_archive = bool(reasons)
          (recovery / "recovery-manifest.json").write_text(
              json.dumps(
                  {
                      "snapshot_key": snapshot_key,
                      "generated_at": snapshot.get("generated_at"),
                      "snapshot_sha256": digest,
                      "ledger_present": bool(ledger_files),
                      "ledger_files": ledger_files,
                      "archive_policy": ARCHIVE_POLICY,
                      "archive_reasons": reasons,
                      "should_archive": should_archive,
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_archive={'true' if should_archive else 'false'}\n")
              output.write(f"snapshot_key={snapshot_key}\n")
              output.write(f"snapshot_sha256={digest}\n")
          PY

      - name: Upload immutable snapshot recovery artifact
        if: steps.snapshot_bundle.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snapshot-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/snapshot-recovery-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30

      - name: Install Node dependencies
        if: (steps.trigger_context.outputs.scheduled_like != 'true' || steps.schedule_gate.outputs.should_run == 'true') && (steps.trigger_context.outputs.scheduled_like != 'true' || steps.publish_guard.outputs.should_publish == 'true')
        run: npm ci

      - name: Build Worker assets
        if: (steps.trigger_context.outputs.scheduled_like != 'true' || steps.schedule_gate.outputs.should_run == 'true') && (steps.trigger_context.outputs.scheduled_like != 'true' || steps.publish_guard.outputs.should_publish == 'true')
        run: npm run build

      - name: Reject unsafe R2 publication until coordinated rollback is implemented
        if: (steps.trigger_context.outputs.scheduled_like != 'true' || steps.schedule_gate.outputs.should_run == 'true') && (steps.trigger_context.outputs.scheduled_like != 'true' || steps.publish_guard.outputs.should_publish == 'true') && vars.ENABLE_R2_DATA_PUBLISH == '1'
        run: |
          echo "R2 publication is fail-closed until the alias and Worker can roll back atomically." >&2
          exit 1

      - name: Capture exact production rollback target
        id: rollback_target
        if: (steps.trigger_context.outputs.scheduled_like != 'true' || steps.schedule_gate.outputs.should_run == 'true') && (steps.trigger_context.outputs.scheduled_like != 'true' || steps.publish_guard.outputs.should_publish == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --no-install wrangler deployments status --name xuangu --json \
            > "${RUNNER_TEMP}/rollback-target-deployment.json"
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request
          import uuid

          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          deployment_path = runner_temp / "rollback-target-deployment.json"
          deployment = json.loads(deployment_path.read_text(encoding="utf-8"))
          versions = deployment.get("versions")
          if not isinstance(versions, list):
              raise SystemExit("production deployment does not expose a versions list")
          if (
              len(versions) != 1
              or not isinstance(versions[0], dict)
              or not isinstance(versions[0].get("percentage"), (int, float))
              or float(versions[0]["percentage"]) != 100.0
          ):
              raise SystemExit("refusing deploy without one exact 100% rollback version")
          version_id = str(versions[0].get("version_id") or "")
          try:
              uuid.UUID(version_id)
          except (ValueError, AttributeError):
              raise SystemExit(f"invalid rollback version id: {version_id!r}")

          request = urllib.request.Request(
              "https://xuangu.alixjd.com/api/latest",
              headers={
                  "Accept": "application/json",
                  "Cache-Control": "no-cache",
                  "User-Agent": "xuangu-deploy-rollback-capture/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              snapshot = json.loads(response.read().decode("utf-8"))
          if not isinstance(snapshot, dict) or not snapshot.get("snapshot_key"):
              raise SystemExit("production rollback snapshot is unavailable")
          (runner_temp / "rollback-target-latest.json").write_text(
              json.dumps(snapshot, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version_id={version_id}\n")
          PY

      - name: Deploy Worker
        id: deploy_worker
        if: (steps.trigger_context.outputs.scheduled_like != 'true' || steps.schedule_gate.outputs.should_run == 'true') && (steps.trigger_context.outputs.scheduled_like != 'true' || steps.publish_guard.outputs.should_publish == 'true')
        run: >-
          npx --no-install wrangler deploy
          --message "github:${{ github.sha }} run:${{ github.run_id }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify complete deployed contract
        id: verify_deployment
        if: (steps.trigger_context.outputs.scheduled_like != 'true' || steps.schedule_gate.outputs.should_run == 'true') && (steps.trigger_context.outputs.scheduled_like != 'true' || steps.publish_guard.outputs.should_publish == 'true')
        run: >-
          python scripts/verify_deployment.py public/data/picks/latest.json
          --base-url https://xuangu.alixjd.com
          --attempts 8
          --delay-seconds 8
          --timeout-seconds 15

      - name: Roll back failed deployment attempt or verification
        if: ${{ failure() && steps.rollback_target.outcome == 'success' && steps.deploy_worker.outcome != 'skipped' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_ROLLBACK_VERSION: ${{ steps.rollback_target.outputs.version_id }}
        run: |
          set -euo pipefail
          npx --no-install wrangler rollback "${EXPECTED_ROLLBACK_VERSION}" \
            --name xuangu \
            --yes \
            --message "rollback failed github:${{ github.sha }} run:${{ github.run_id }}"
          npx --no-install wrangler deployments status --name xuangu --json \
            > "${RUNNER_TEMP}/rollback-result-deployment.json"
          python - <<'PY'
          import json
          import os
          import pathlib
          import time
          from scripts.verify_deployment import fetch_json, snapshot_sha256

          deployment = json.loads(
              (pathlib.Path(os.environ["RUNNER_TEMP"]) / "rollback-result-deployment.json").read_text(
                  encoding="utf-8"
              )
          )
          versions = deployment.get("versions")
          expected = os.environ["EXPECTED_ROLLBACK_VERSION"]
          if (
              not isinstance(versions, list)
              or len(versions) != 1
              or not isinstance(versions[0], dict)
              or versions[0].get("version_id") != expected
              or not isinstance(versions[0].get("percentage"), (int, float))
              or float(versions[0]["percentage"]) != 100.0
          ):
              raise SystemExit("rollback did not restore the exact previous version at 100%")

          expected_snapshot = json.loads(
              (pathlib.Path(os.environ["RUNNER_TEMP"]) / "rollback-target-latest.json").read_text(
                  encoding="utf-8"
              )
          )
          expected_digest = snapshot_sha256(expected_snapshot)
          last_error = "rollback endpoint did not converge"
          for attempt in range(1, 9):
              try:
                  live = fetch_json("https://xuangu.alixjd.com/api/latest", timeout=15)
                  if (
                      live.get("snapshot_key") == expected_snapshot.get("snapshot_key")
                      and live.get("generated_at") == expected_snapshot.get("generated_at")
                      and snapshot_sha256(live) == expected_digest
                  ):
                      print("Rollback restored the exact previous snapshot identity.")
                      break
                  last_error = "snapshot identity or digest differs from rollback target"
              except (OSError, ValueError, TypeError) as exc:
                  last_error = str(exc)
              if attempt < 8:
                  time.sleep(8)
          else:
              raise SystemExit(f"rollback snapshot identity verification failed: {last_error}")
          PY

      - name: Create verified scheduler checkpoint receipt
        id: checkpoint_receipt
        if: steps.trigger_context.outputs.scheduled_like == 'true' && steps.schedule_gate.outputs.should_run == 'true' && steps.publish_guard.outputs.should_publish == 'true' && steps.verify_deployment.outcome == 'success'
        run: |
          set -euo pipefail
          receipt_root="${RUNNER_TEMP}/scheduler-checkpoint-receipt-${GITHUB_RUN_ID}"
          receipt_name="ghrun_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json"
          mkdir -p "${receipt_root}"
          python scripts/scheduler_checkpoint_ledger.py create \
            --snapshot data/picks/latest.json \
            --output "${receipt_root}/${receipt_name}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --workflow-sha "${GITHUB_SHA}" \
            --publication-backend embedded
          python scripts/scheduler_checkpoint_ledger.py validate \
            "${receipt_root}/${receipt_name}"
          echo "created=true" >> "${GITHUB_OUTPUT}"

      - name: Upload verified scheduler checkpoint receipt
        if: steps.checkpoint_receipt.outputs.created == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scheduler-checkpoint-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/scheduler-checkpoint-receipt-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30

  archive:
    needs: deploy
    if: needs.deploy.result == 'success' && needs.deploy.outputs.should_archive == 'true' && needs.deploy.outputs.should_publish != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install archive validation dependencies
        run: pip install -r requirements.txt

      - name: Download verified recovery bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: snapshot-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/archive-payload

      - name: Validate archive payload
        env:
          EXPECTED_SNAPSHOT_KEY: ${{ needs.deploy.outputs.snapshot_key }}
          EXPECTED_SNAPSHOT_SHA256: ${{ needs.deploy.outputs.snapshot_sha256 }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          from scripts.verify_deployment import snapshot_sha256

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "archive-payload"
          manifest = json.loads((root / "recovery-manifest.json").read_text(encoding="utf-8"))
          latest = json.loads((root / "data" / "picks" / "latest.json").read_text(encoding="utf-8"))
          digest = snapshot_sha256(latest)
          expected_key = os.environ["EXPECTED_SNAPSHOT_KEY"]
          expected_digest = os.environ["EXPECTED_SNAPSHOT_SHA256"]
          if manifest.get("snapshot_key") != expected_key or latest.get("snapshot_key") != expected_key:
              raise SystemExit("archive snapshot_key does not match deploy output")
          if manifest.get("snapshot_sha256") != expected_digest or digest != expected_digest:
              raise SystemExit("archive snapshot sha256 does not match deploy output")
          immutable = root / "data" / "picks" / expected_key
          if not immutable.is_file():
              raise SystemExit(f"immutable archive payload is missing: {immutable}")
          immutable_payload = json.loads(immutable.read_text(encoding="utf-8"))
          if snapshot_sha256(immutable_payload) != expected_digest:
              raise SystemExit("immutable archive snapshot sha256 does not match deploy output")

          ledger_files = manifest.get("ledger_files") or []
          if not isinstance(ledger_files, list):
              raise SystemExit("archive ledger_files must be a list")
          if bool(ledger_files) != bool(manifest.get("ledger_present")):
              raise SystemExit("archive ledger_present does not match ledger_files")
          for relative_name in ledger_files:
              relative = pathlib.PurePosixPath(str(relative_name))
              if relative.is_absolute() or ".." in relative.parts or not relative.parts or relative.parts[0] != "data":
                  raise SystemExit(f"unsafe archive ledger path: {relative_name!r}")
              if not (root / relative).is_file():
                  raise SystemExit(f"archive ledger file is missing: {relative_name}")
          PY
          python scripts/validate_snapshot.py "${RUNNER_TEMP}/archive-payload/data/picks/latest.json"

      - name: Archive generated snapshot with bounded conflict retries
        env:
          SNAPSHOT_KEY: ${{ needs.deploy.outputs.snapshot_key }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          payload_root="${RUNNER_TEMP}/archive-payload"

          push_archive_with_scoped_token() {
            archive_tree="$1"
            auth_header="$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n')"
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}" \
              git -C "${archive_tree}" push origin HEAD:main
            push_status="$?"
            unset auth_header
            return "${push_status}"
          }

          for attempt in 1 2 3; do
            echo "Archive push attempt ${attempt}/3"
            if ! git fetch --prune origin main; then
              echo "Fetch failed before archive attempt ${attempt}" >&2
              sleep "$((attempt * 5))"
              continue
            fi

            attempt_root="$(mktemp -d "${RUNNER_TEMP}/xuangu-archive-${attempt}-XXXXXX")"
            archive_tree="${attempt_root}/worktree"
            if ! git worktree add --detach "${archive_tree}" origin/main; then
              echo "Unable to create archive worktree for attempt ${attempt}" >&2
              sleep "$((attempt * 5))"
              continue
            fi

            # Merge monotonically: a delayed retry may add its immutable
            # snapshot, but it must never replace a newer latest.json,
            # downgrade SETTLED to PENDING, or discard observation revisions.
            if ! python "${archive_tree}/scripts/merge_archive_payload.py" "${payload_root}" "${archive_tree}"; then
              echo "Archive payload conflicts with newer main on attempt ${attempt}" >&2
              git worktree remove --force "${archive_tree}"
              sleep "$((attempt * 5))"
              continue
            fi
            git -C "${archive_tree}" add -- data
            archive_add_status="$?"
            if ((archive_add_status != 0)); then
              echo "Archive staging failed on attempt ${attempt}" >&2
              git worktree remove --force "${archive_tree}"
              sleep "$((attempt * 5))"
              continue
            fi
            if git -C "${archive_tree}" diff --cached --quiet; then
              echo "Snapshot ${SNAPSHOT_KEY} is already archived."
              git worktree remove "${archive_tree}"
              exit 0
            fi

            # The verified snapshot is already live. Avoid a redundant second
            # deploy when this archival-only commit reaches main.
            if ! git -C "${archive_tree}" commit -m "Update daily pick snapshot: ${SNAPSHOT_KEY} [skip ci]"; then
              echo "Archive commit failed on attempt ${attempt}" >&2
              git worktree remove "${archive_tree}"
              sleep "$((attempt * 5))"
              continue
            fi

            # Close the race between the first fetch and the push. A rebase
            # conflict is discarded and rebuilt from a fresh origin/main on
            # the next bounded attempt.
            if ! git fetch --prune origin main || ! git -C "${archive_tree}" rebase origin/main; then
              echo "Archive rebase failed on attempt ${attempt}" >&2
              git -C "${archive_tree}" rebase --abort >/dev/null 2>&1 || :
              git worktree remove --force "${archive_tree}"
              sleep "$((attempt * 5))"
              continue
            fi
            if push_archive_with_scoped_token "${archive_tree}"; then
              git worktree remove "${archive_tree}"
              echo "Archived ${SNAPSHOT_KEY} successfully."
              exit 0
            fi

            echo "Archive push conflicted on attempt ${attempt}; rebuilding from the newest main." >&2
            git worktree remove "${archive_tree}"
            sleep "$((attempt * 5))"
          done

          echo "Archive failed after 3 bounded attempts; marking workflow red." >&2
          exit 1

  checkpoint-ledger:
    needs: deploy
    if: needs.deploy.result == 'success' && needs.deploy.outputs.has_checkpoint_receipt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Download verified scheduler checkpoint receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scheduler-checkpoint-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/scheduler-checkpoint-receipt

      - name: Persist only the immutable scheduler receipt
        run: |
          set -uo pipefail
          mapfile -d '' receipts < <(
            find "${RUNNER_TEMP}/scheduler-checkpoint-receipt" \
              -type f -name 'ghrun_*.json' -print0
          )
          if ((${#receipts[@]} != 1)); then
            echo "Expected exactly one verified scheduler receipt; found ${#receipts[@]}" >&2
            exit 1
          fi
          receipt_source="${receipts[0]}"
          receipt_name="$(basename "${receipt_source}")"
          python scripts/scheduler_checkpoint_ledger.py validate "${receipt_source}"

          push_receipt_with_scoped_token() {
            receipt_tree="$1"
            auth_header="$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n')"
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}" \
              git -C "${receipt_tree}" push origin HEAD:main
            push_status="$?"
            unset auth_header
            return "${push_status}"
          }

          for attempt in 1 2 3; do
            echo "Scheduler receipt push attempt ${attempt}/3"
            if ! git fetch --prune origin main; then
              echo "Fetch failed before scheduler receipt attempt ${attempt}" >&2
              sleep "$((attempt * 5))"
              continue
            fi
            attempt_root="$(mktemp -d "${RUNNER_TEMP}/xuangu-scheduler-receipt-${attempt}-XXXXXX")"
            receipt_tree="${attempt_root}/worktree"
            if ! git worktree add --detach "${receipt_tree}" origin/main; then
              echo "Unable to create scheduler receipt worktree on attempt ${attempt}" >&2
              sleep "$((attempt * 5))"
              continue
            fi
            target_relative="data/outcomes/scheduler-checkpoints/${receipt_name}"
            if ! python "${receipt_tree}/scripts/scheduler_checkpoint_ledger.py" install \
              "${receipt_source}" \
              --directory "${receipt_tree}/data/outcomes/scheduler-checkpoints"; then
              echo "Scheduler receipt conflicts with immutable main evidence" >&2
              git worktree remove --force "${receipt_tree}"
              sleep "$((attempt * 5))"
              continue
            fi
            if ! git -C "${receipt_tree}" add -- "${target_relative}"; then
              echo "Scheduler receipt staging failed on attempt ${attempt}" >&2
              git worktree remove --force "${receipt_tree}"
              sleep "$((attempt * 5))"
              continue
            fi
            staged_paths="$(git -C "${receipt_tree}" diff --cached --name-only)"
            if [ -n "${staged_paths}" ] && [ "${staged_paths}" != "${target_relative}" ]; then
              echo "Refusing to commit anything except ${target_relative}: ${staged_paths}" >&2
              git worktree remove --force "${receipt_tree}"
              exit 1
            fi
            if git -C "${receipt_tree}" diff --cached --quiet; then
              echo "Scheduler receipt ${receipt_name} is already persisted."
              git worktree remove "${receipt_tree}"
              exit 0
            fi
            git -C "${receipt_tree}" config user.name "github-actions[bot]"
            git -C "${receipt_tree}" config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git -C "${receipt_tree}" commit \
              -m "Record scheduler checkpoint ${receipt_name} [skip ci]"; then
              echo "Scheduler receipt commit failed on attempt ${attempt}" >&2
              git worktree remove --force "${receipt_tree}"
              sleep "$((attempt * 5))"
              continue
            fi
            if ! git fetch --prune origin main || \
              ! git -C "${receipt_tree}" rebase origin/main; then
              echo "Scheduler receipt rebase failed on attempt ${attempt}" >&2
              git -C "${receipt_tree}" rebase --abort >/dev/null 2>&1 || :
              git worktree remove --force "${receipt_tree}"
              sleep "$((attempt * 5))"
              continue
            fi
            if ! python "${receipt_tree}/scripts/scheduler_checkpoint_ledger.py" validate \
              "${receipt_tree}/${target_relative}"; then
              echo "Scheduler receipt validation changed after rebase" >&2
              git worktree remove --force "${receipt_tree}"
              sleep "$((attempt * 5))"
              continue
            fi
            if push_receipt_with_scoped_token "${receipt_tree}"; then
              git worktree remove "${receipt_tree}"
              echo "Scheduler receipt ${receipt_name} persisted successfully."
              exit 0
            fi
            echo "Scheduler receipt push conflicted on attempt ${attempt}" >&2
            git worktree remove --force "${receipt_tree}"
            sleep "$((attempt * 5))"
          done

          echo "Scheduler receipt persistence failed after 3 bounded attempts" >&2
          exit 1
